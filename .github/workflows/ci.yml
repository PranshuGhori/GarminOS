name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run seed:mock
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start with demo data
        run: GARMIN_MOCK=1 docker compose up -d --build
      - name: Smoke test every page
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          for p in / /coach /sleep /activities /trends /body /explorer; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { docker compose logs; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://localhost:3000/)
          echo "foreign host -> $code"; [ "$code" = "403" ]
