# Usage:
#   cp .env.example .env    (paste your Garmin Personal API key)
#   docker compose up -d    then open http://localhost:3000 and press "Sync Now"
#
# Demo data instead of a real account:
#   GARMIN_MOCK=1 docker compose up -d
services:
  garminos:
    build: .
    image: garminos
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GARMIN_MOCK: ${GARMIN_MOCK:-}
    ports:
      # Published on this machine only. The dashboard has no login: do not change this to 0.0.0.0
      # unless you also set DASHBOARD_ALLOW_LAN=1 and trust everyone on your network.
      - "127.0.0.1:3000:3000"
    volumes:
      - garminos-data:/data

volumes:
  garminos-data:
